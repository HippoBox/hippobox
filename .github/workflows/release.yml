name: Verify and release HippoBox
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      ref:
        description: 'Version tag to verify and publish (vX.Y.Z or vX.Y.Z-rc.N)'
        required: true
        type: string
      pypi_only:
        description: Publish an already verified GitHub release to PyPI without rebuilding
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: release-${{ inputs.ref || github.ref_name }}
  cancel-in-progress: false
jobs:
  verify:
    if: ${{ !inputs.pypi_only }}
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: astral-sh/setup-uv@v6
      - name: Validate version
        id: version
        env:
          TAG: ${{ inputs.ref || github.ref_name }}
        run: python scripts/check-release.py
      - run: make install
      - run: cd src/frontend && npx playwright install --with-deps chromium
      - run: make verify
      - uses: actions/upload-artifact@v4
        with:
          name: distribution
          path: src/backend/dist/*
  image:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/hippobox/hippobox
          tags: |
            type=raw,value=${{ needs.verify.outputs.version }}
            type=raw,value=v${{ needs.verify.outputs.version }}
            type=raw,value=latest,enable=${{ needs.verify.outputs.prerelease == 'false' }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
  release:
    needs: [verify, image]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/download-artifact@v4
        with:
          name: distribution
          path: dist
      - name: Publish release and deployment files
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.ref || github.ref_name }}
          PRERELEASE: ${{ needs.verify.outputs.prerelease }}
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            if [ "$PRERELEASE" = true ]; then
              gh release create "$TAG" --prerelease --title "HippoBox $TAG" --notes-file docs/release-notes.md
            else
              gh release create "$TAG" --title "HippoBox $TAG" --notes-file docs/release-notes.md
            fi
          fi
          cp docker/.env.release.example dist/default.env.release.example
          gh release upload "$TAG" dist/* docker/compose.release.yml docker/compose.local.yml docker/compose.sqlite.yml docker/nginx.conf.example src/frontend/public/hippobox-mcp-icon.png --clobber

  pypi:
    needs: [release]
    if: ${{ always() && !cancelled() && (needs.release.result == 'success' || (github.event_name == 'workflow_dispatch' && inputs.pypi_only)) }}
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/hippobox/
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - name: Download and validate published distributions
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.ref || github.ref_name }}
        run: |
          python scripts/check-release.py
          mkdir -p pypi-dist
          gh release download "$TAG" --pattern '*.whl' --pattern '*.tar.gz' --dir pypi-dist
          python - <<'PYTHON'
          import hashlib, json, os, subprocess, tomllib
          from pathlib import Path
          version = tomllib.loads(Path("src/backend/pyproject.toml").read_text())["project"]["version"]
          release = json.loads(subprocess.check_output(["gh", "release", "view", os.environ["TAG"], "--json", "isDraft,assets"]))
          assert not release["isDraft"], "Only published release distributions may be uploaded"
          expected = {f"hippobox-{version}-py3-none-any.whl", f"hippobox-{version}.tar.gz"}
          files = list(Path("pypi-dist").iterdir())
          assert {path.name for path in files} == expected, "Unexpected release distributions"
          digests = {asset["name"]: asset["digest"] for asset in release["assets"]}
          for path in files:
              assert digests[path.name] == "sha256:" + hashlib.sha256(path.read_bytes()).hexdigest(), "Release digest mismatch"
          print("Published wheel and sdist digests verified")
          PYTHON
      - name: Publish verified artifacts with PyPI Trusted Publishing
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: pypi-dist/
          skip-existing: true
