name: Verify and release HippoBox
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      ref:
        description: 'Version tag to verify and publish (vX.Y.Z or vX.Y.Z-rc.N)'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: release-${{ inputs.ref || github.ref_name }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: astral-sh/setup-uv@v6
      - name: Validate version
        id: version
        env:
          TAG: ${{ inputs.ref || github.ref_name }}
        run: python scripts/check-release.py
      - run: make install
      - run: cd src/frontend && npx playwright install --with-deps chromium
      - run: make verify
      - uses: actions/upload-artifact@v4
        with:
          name: distribution
          path: src/backend/dist/*
  image:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/hippobox/hippobox
          tags: |
            type=raw,value=${{ needs.verify.outputs.version }}
            type=raw,value=v${{ needs.verify.outputs.version }}
            type=raw,value=latest,enable=${{ needs.verify.outputs.prerelease == 'false' }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
  release:
    needs: [verify, image]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/download-artifact@v4
        with:
          name: distribution
          path: dist
      - name: Publish release and deployment files
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.ref || github.ref_name }}
          PRERELEASE: ${{ needs.verify.outputs.prerelease }}
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            if [ "$PRERELEASE" = true ]; then
              gh release create "$TAG" --prerelease --title "HippoBox $TAG" --notes-file docs/release-notes.md
            else
              gh release create "$TAG" --title "HippoBox $TAG" --notes-file docs/release-notes.md
            fi
          fi
          gh release upload "$TAG" dist/* docker/compose.release.yml docker/.env.release.example --clobber
