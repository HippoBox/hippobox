# Linux host proxy, managed independently of either application repository.
name: shared-caddy
services:
  caddy:
    image: caddy:2.11.7-alpine@sha256:d8542f48d34a9cf4e4c11a478865229840e87e4c96ea3f439101f31a5d35f75f
    network_mode: host
    env_file: .env
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, 'http://127.0.0.1:2019/config/']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
volumes:
  caddy_data:
    external: true
    name: shared_caddy_data
  caddy_config:
    external: true
    name: shared_caddy_config
